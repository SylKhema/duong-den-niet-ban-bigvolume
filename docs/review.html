<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản lý góp ý — Bộ Đại I–V</title><link rel="stylesheet" href="/style.css"><style>main{margin:0 auto;max-width:1000px;padding:30px 24px}article{border:1px solid #cad1c0;border-radius:7px;padding:22px;margin:20px 0;overflow-wrap:anywhere}label{display:block;margin:12px 0}textarea{width:100%;padding:12px;font:16px/1.6 system-ui}select{padding:8px}.text{white-space:pre-wrap;background:#f0f0e5;padding:12px;font:15px/1.8 system-ui}.private{font:14px system-ui;color:#6c7469}button{margin:7px 7px 7px 0}</style></head><body><main><a href="/">← Trở về bộ sách</a><h1>Quản lý góp ý</h1><p>Chỉ tài khoản người phụ trách được xem nội dung gửi và thông tin liên hệ. Việc cập nhật trạng thái ở đây không tự sửa bản dịch hay tạo lại PDF/EPUB.</p><p><a href="/signin-with-chatgpt?return_to=%2Freview.html" target="_top">Đăng nhập bằng tài khoản ChatGPT của người phụ trách</a></p><p id="notice" role="status">Đang kiểm tra quyền truy cập…</p><div id="items"></div><button id="next" hidden>Trang tiếp theo</button></main><script>
const statuses={new:'Mới nhận',reviewing:'Đang đối chiếu','needs-info':'Cần thêm căn cứ',resolved:'Đã sửa',unchanged:'Giữ nguyên và giải thích',duplicate:'Góp ý trùng'},cats={typo:'Lỗi chữ/trình bày',translation:'Nghi dịch sai/thiếu',terminology:'Thuật ngữ',question:'Câu hỏi',other:'Khác'};let next=0;const box=document.querySelector('#items'),notice=document.querySelector('#notice');const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
async function load(){notice.textContent='Đang tải…';try{const r=await fetch('/api/review?offset='+next),d=await r.json();if(!r.ok)throw Error(d.error);box.replaceChildren();notice.textContent=d.entries.length?'Góp ý được lưu riêng. Chỉ ghi vào phần công khai nội dung đã biên tập, không chép email hoặc thông tin riêng.':'Chưa có góp ý nào.';for(const x of d.entries){const a=node('article'),h=node('h2',x.id),meta=node('p','Tập '+['I','II','III','IV','V'][x.volume-1]+' · Miến '+x.printed+' · PDF '+x.pdf_page+' · '+(cats[x.category]||x.category)),date=node('p',new Date(x.created_at).toLocaleString('vi-VN'),'private'),contact=node('p','Liên hệ riêng: '+(x.name||'(ẩn danh)')+(x.email?' · '+x.email:''),'private'),link=node('a','Mở vị trí trong sách');link.href='/#tap/'+x.volume+'/'+encodeURIComponent(x.anchor);a.append(h,meta,date,contact,link);for(const [label,value] of [['Đoạn trích',x.excerpt],['Ý kiến',x.message],['Đề nghị sửa',x.suggestion],['Nguồn đối chiếu',x.reference]]){a.append(node('h3',label),node('p',value||'(không có)','text'))}const select=node('select');select.setAttribute('aria-label','Trạng thái '+x.id);for(const [k,v] of Object.entries(statuses)){const o=node('option',v);o.value=k;o.selected=k===x.status;select.append(o)}const priv=node('textarea');priv.rows=3;priv.maxLength=4000;priv.value=x.editorial_note;priv.setAttribute('aria-label','Ghi chú biên tập riêng '+x.id);const pub=node('textarea');pub.rows=4;pub.maxLength=4000;pub.value=x.public_note;pub.placeholder='Ghi câu cũ/câu mới, lý do và nguồn đối chiếu nếu đã sửa. Không đưa thông tin riêng vào đây.';pub.setAttribute('aria-label','Giải thích công khai '+x.id);const checkbox=node('input');checkbox.type='checkbox';checkbox.checked=!!x.published;const checklabel=node('label');checklabel.append(checkbox,document.createTextNode(' Công bố phần giải thích trên nhật ký (chỉ khi Đã sửa hoặc Giữ nguyên và giải thích)'));const save=node('button','Lưu xử lý'),result=node('p');result.setAttribute('role','status');save.onclick=async()=>{save.disabled=true;result.textContent='Đang lưu…';try{const r=await fetch('/api/review',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:x.id,status:select.value,editorial_note:priv.value,public_note:pub.value,published:checkbox.checked})}),d=await r.json();if(!r.ok)throw Error(d.error);result.textContent='Đã lưu.';}catch(e){result.textContent=e.message||'Chưa lưu được.';}finally{save.disabled=false}};a.append(node('label','Trạng thái'),select,node('label','Ghi chú biên tập riêng'),priv,node('label','Giải thích để công khai khi được duyệt'),pub,checklabel,save,result);box.append(a)}next=d.nextOffset;document.querySelector('#next').hidden=next===null;}catch(e){notice.textContent=e.message||'Chưa tải được góp ý.';}}
document.querySelector('#next').onclick=load;load();
</script></body></html>
