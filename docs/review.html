<!doctype html><html lang="vi" data-surface="review"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex, nofollow"><link rel="icon" type="image/x-icon" href="/favicon.ico"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png"><link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png"><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"><link rel="manifest" href="/site.webmanifest"><title>Quản lý góp ý — Bộ Đại I–V</title><link rel="stylesheet" href="/big/style.css"><style>main{margin:0 auto;max-width:1000px;padding:30px 24px}article{border:1px solid #cad1c0;border-radius:7px;padding:22px;margin:20px 0;overflow-wrap:anywhere}label{display:block;margin:12px 0}textarea{width:100%;padding:12px;font:16px/1.6 system-ui}select{padding:8px}.text{white-space:pre-wrap;background:#f0f0e5;padding:12px;font:15px/1.8 system-ui}.private{font:14px system-ui;color:#6c7469}button{margin:7px 7px 7px 0}.auth-box{margin:20px 0;padding:16px;border:1px solid #cad1c0;border-radius:6px;background:#f5f6f0}.auth-box form{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}.auth-box label{margin:0}.auth-box input{padding:10px;font:15px system-ui;border:1px solid #bec7b6;border-radius:4px;min-width:220px}.auth-box button{background:#273d34;color:white;padding:10px 16px;border:none;border-radius:4px;cursor:pointer}</style><link rel="stylesheet" href="/theme.css?v=1"><script src="/theme.js?v=1"></script><script src="/feedback-config.js?v=2"></script><script src="/firebase-feedback.js?v=1"></script></head><body><main><div class="theme-toolbar"><label class="theme-control"><span lang="vi">Giao diện</span><span lang="en">Theme</span><select data-theme-picker aria-label="Giao diện đọc"><option value="system">Theo thiết bị</option><option value="light">Sáng</option><option value="dark">Tối</option></select></label></div><a href="/">← Trở về bộ sách</a><h1>Quản lý góp ý</h1><p>Chỉ tài khoản người phụ trách được xem nội dung gửi và thông tin liên hệ. Việc cập nhật trạng thái ở đây không tự sửa bản dịch hay tạo lại PDF/EPUB.</p><div id="auth-panel" class="auth-box"><form id="auth-form"><label for="auth-email"><strong>Email quản trị:</strong></label><input type="email" id="auth-email" autocomplete="username" placeholder="admin@example.org" required><label for="auth-password"><strong>Mật khẩu:</strong></label><input type="password" id="auth-password" autocomplete="current-password" placeholder="Mật khẩu Firebase…" required><button type="submit">Đăng nhập</button></form><div id="auth-status"></div></div><p id="notice" role="status">Đang kiểm tra quyền truy cập…</p><div id="items"></div><button id="next" hidden>Trang tiếp theo</button></main><script>
const fb=window.nibbanaFeedback;
const statuses={new:'Mới nhận',reviewing:'Đang đối chiếu',approved:'Đã duyệt bản sửa','needs-info':'Cần thêm căn cứ',resolved:'Đã sửa',unchanged:'Giữ nguyên và giải thích',duplicate:'Góp ý trùng'},cats={typo:'Lỗi chữ/trình bày',translation:'Nghi dịch sai/thiếu',terminology:'Thuật ngữ',question:'Câu hỏi',other:'Khác'};let next=0;const box=document.querySelector('#items'),notice=document.querySelector('#notice'),authForm=document.querySelector('#auth-form'),authEmailInput=document.querySelector('#auth-email'),authPasswordInput=document.querySelector('#auth-password'),authStatus=document.querySelector('#auth-status');
const node=(tag,text,cls)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n};
function updateAuthUI(){
  const session=fb.getAdminSession();
  authStatus.replaceChildren();
  if(session){
    authForm.hidden=true;
    const span=node('span','Đã đăng nhập: '+(session.email||session.localId)+' ');
    const btn=node('button','Đăng xuất');
    btn.type='button';
    btn.style.cssText='padding:6px 12px;font-size:13px;background:#6c7469;color:white;border:none;border-radius:4px;cursor:pointer';
    btn.onclick=()=>{fb.signOutAdmin();updateAuthUI();box.replaceChildren();notice.textContent='Vui lòng đăng nhập lại.';document.querySelector('#next').hidden=true;};
    authStatus.append(span,btn);
  }else{
    authForm.hidden=false;
  }
}
authForm.onsubmit=async e=>{
  e.preventDefault();
  const submitBtn=authForm.querySelector('button[type=submit]');
  const email=authEmailInput.value.trim();
  const password=authPasswordInput.value;
  if(!email||!password)return;
  submitBtn.disabled=true;
  notice.textContent='Đang đăng nhập…';
  try{
    await fb.signInAdmin(email,password);
    authPasswordInput.value='';
    next=0;
    await load();
  }catch(err){
    updateAuthUI();
    notice.textContent=err?.message||'Đăng nhập thất bại.';
  }finally{
    submitBtn.disabled=false;
  }
};
async function load(){
  updateAuthUI();
  if(!fb.isConfigured()){
    notice.textContent='Hệ thống góp ý Firebase chưa được cấu hình (thiếu projectId / apiKey trong /feedback-config.js).';
    box.replaceChildren();
    document.querySelector('#next').hidden=true;
    return;
  }
  if(!fb.getAdminSession()){
    notice.textContent='Vui lòng đăng nhập tài khoản quản trị Firebase để xem danh sách góp ý.';
    box.replaceChildren();
    document.querySelector('#next').hidden=true;
    return;
  }
  notice.textContent='Đang tải…';
  try{
    const d=await fb.listReviewFeedback({offset:next});
    updateAuthUI();
    box.replaceChildren();
    notice.textContent=d.entries.length?'Góp ý được lưu riêng. Chỉ ghi vào phần công khai nội dung đã biên tập, không chép email hoặc thông tin riêng.':'Chưa có góp ý nào.';
    for(const x of d.entries){
      const mini=x.series==='mini', language=x.language||'vi';
      const edition=mini?'Bộ Tóm Lược · Cuốn '+x.volume:'Bộ Đại · Tập '+['I','II','III','IV','V'][x.volume-1];
      const a=node('article'),h=node('h2',x.id),meta=node('p',edition+' · '+({vi:'Việt',en:'English',bi:'Việt–Anh'}[language])+' · Miến '+x.printed+' · PDF '+x.pdf_page+' · '+(cats[x.category]||x.category)),date=node('p',new Date(x.created_at).toLocaleString('vi-VN'),'private'),contact=node('p','Liên hệ riêng: '+(x.name||'(ẩn danh)')+(x.email?' · '+x.email:''),'private'),link=node('a','Mở vị trí trong sách');
      link.href=mini?'/mini/?lang='+language+'#cuon-'+x.volume+(x.anchor==='general'?'':'/'+encodeURIComponent(x.anchor)):'/big/#tap/'+x.volume+(x.anchor==='general'?'':'/'+encodeURIComponent(x.anchor));
      a.append(h,meta,date,contact,link);
      for(const [label,value] of [['Đoạn trích',x.excerpt],['Ý kiến',x.message],['Đề nghị sửa',x.suggestion],['Nguồn đối chiếu',x.reference]]){
        a.append(node('h3',label),node('p',value||'(không có)','text'))
      }
      const select=node('select');
      select.setAttribute('aria-label','Trạng thái '+x.id);
      for(const [k,v] of Object.entries(statuses)){
        const o=node('option',v);o.value=k;o.selected=k===x.status;select.append(o)
      }
      const original=node('textarea'),revision=node('textarea'),release=node('input');
      original.rows=4;original.maxLength=12000;original.value=x.original||'';original.setAttribute('aria-label','Đoạn trước khi sửa');
      revision.rows=4;revision.maxLength=12000;revision.value=x.revision||'';revision.setAttribute('aria-label','Đoạn đề xuất sau khi sửa');
      release.maxLength=40;release.value=x.release_commit||'';release.setAttribute('aria-label','Commit GitHub đã xuất bản');
      a.append(node('h3','Trước khi sửa'),original,node('h3','Đề xuất sau khi sửa'),revision,node('h3','Commit GitHub đã xuất bản'),release);
      const priv=node('textarea');priv.rows=3;priv.maxLength=4000;priv.value=x.editorial_note;priv.setAttribute('aria-label','Ghi chú biên tập riêng '+x.id);
      const pub=node('textarea');pub.rows=4;pub.maxLength=4000;pub.value=x.public_note;pub.placeholder='Ghi câu cũ/câu mới, lý do và nguồn đối chiếu nếu đã sửa. Không đưa thông tin riêng vào đây.';pub.setAttribute('aria-label','Giải thích công khai '+x.id);
      const checkbox=node('input');checkbox.type='checkbox';checkbox.checked=!!x.published;
      const checklabel=node('label');checklabel.append(checkbox,document.createTextNode(' Công bố phần giải thích trên nhật ký (chỉ khi Đã sửa hoặc Giữ nguyên và giải thích)'));
      const save=node('button','Lưu xử lý'),result=node('p');result.setAttribute('role','status');
      save.onclick=async()=>{
        save.disabled=true;result.textContent='Đang lưu…';
        try{
          const saved=await fb.saveReviewFeedback({
            id:x.id,
            status:select.value,
            editorial_note:priv.value,
            public_note:pub.value,
            published:checkbox.checked,
            original:original.value,
            revision:revision.value,
            release_commit:release.value.trim(),
            expectedUpdateTime:x._update_time
          });
          x.status=select.value;
          x.editorial_note=priv.value.trim();
          x.public_note=pub.value.trim();
          x.published=checkbox.checked;
          x.original=original.value.trim();
          x.revision=revision.value.trim();
          x.release_commit=select.value==='resolved'?release.value.trim():'';
          if(select.value!=='resolved')release.value='';
          if(saved.updateTime)x._update_time=saved.updateTime;
          result.textContent='Đã lưu.';
        }catch(e){
          if(e?.status===401||e?.status===403)updateAuthUI();
          result.textContent=e?.message||'Chưa lưu được.';
        }finally{
          save.disabled=false;
        }
      };
      a.append(node('label','Trạng thái'),select,node('label','Ghi chú biên tập riêng'),priv,node('label','Giải thích để công khai khi được duyệt'),pub,checklabel,save,result);
      box.append(a)
    }
    next=d.nextOffset;
    document.querySelector('#next').hidden=next===null;
  }catch(e){
    if(e?.status===401||e?.status===403){
      updateAuthUI();
      box.replaceChildren();
      document.querySelector('#next').hidden=true;
    }
    notice.textContent=e?.message||'Chưa tải được góp ý.';
  }
}
document.querySelector('#next').onclick=load;
load();
</script></body></html>
